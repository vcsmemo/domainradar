name: Fully Automated Daily Domain Radar & Cloudflare Deploy

on:
  schedule:
    # 每日 UTC 07:00 (北京时间 15:00) 自动在云端全自动运行与部署
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  auto-fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Data Pipeline & Send Resend Pro Alerts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
        run: |
          python scripts/fetch_domains.py

      - name: Install Dependencies & Build SSG Site
        run: |
          npm install
          npm run build

      - name: Deploy Directly to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist --project-name=nichedomainradar --commit-dirty=true
