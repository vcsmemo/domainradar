<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark Obsidian Background -->
  <rect width="100" height="100" rx="22" fill="#080B08" />
  
  <!-- Outer Glowing Radar Circle -->
  <circle cx="50" cy="50" r="38" stroke="#10B981" stroke-width="3" opacity="0.4" />
  <circle cx="50" cy="50" r="28" stroke="#10B981" stroke-width="2.5" opacity="0.6" />
  <circle cx="50" cy="50" r="18" stroke="#10B981" stroke-width="2" opacity="0.8" />
  <circle cx="50" cy="50" r="6" fill="#10B981" />

  <!-- Radar Scanning Beam Hand -->
  <line x1="50" y1="50" x2="78" y2="22" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" />
  <path d="M50 50 L78 22 A38 38 0 0 0 50 12 Z" fill="url(#radar-sweep)" opacity="0.4" />

  <!-- Domain Network Grid Mesh in Lower Half -->
  <path d="M22 62 C32 78 68 78 78 62" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" opacity="0.7" />
  <line x1="30" y1="54" x2="70" y2="54" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
  <line x1="50" y1="50" x2="50" y2="88" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
  <line x1="50" y1="50" x2="28" y2="76" stroke="#10B981" stroke-width="1.5" opacity="0.6" />
  <line x1="50" y1="50" x2="72" y2="76" stroke="#10B981" stroke-width="1.5" opacity="0.6" />

  <!-- Active Domain Pulse Nodes -->
  <circle cx="30" cy="54" r="2.5" fill="#34D399" />
  <circle cx="70" cy="54" r="2.5" fill="#34D399" />
  <circle cx="28" cy="76" r="2.5" fill="#34D399" />
  <circle cx="72" cy="76" r="2.5" fill="#34D399" />
  <circle cx="78" cy="22" r="3" fill="#6EE7B7" />

  <!-- Gradient Shader -->
  <defs>
    <radialGradient id="radar-sweep" cx="50" cy="50" r="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
