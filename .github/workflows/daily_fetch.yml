name: Daily Domain Radar Fetcher

on:
  schedule:
    # 每日 UTC 07:00 (北京时间 15:00) 自动定时触发
    - cron: '0 7 * * *'
  # 允许在 GitHub Actions 界面手动一键触发运行
  workflow_dispatch:

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Data Pipeline (Fetch & Clean Expired Domains)
        run: |
          python scripts/fetch_domains.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/domains.ts scripts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update daily clean expired domains [skip ci]" && git push)
