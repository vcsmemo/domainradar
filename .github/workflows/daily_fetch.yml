name: Fully Automated Daily Domain Radar & Cloudflare Deploy

on:
  schedule:
    # 每日 UTC 07:00 (北京时间 15:00) 自动在云端全自动运行
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Data Pipeline & Generate Fresh Daily Domains
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
        run: |
          python scripts/fetch_domains.py

      - name: Build Astro SSG Site
        run: |
          npm install
          npm run build

      - name: Commit and Push Fresh Daily Data Back to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/domains.ts dist/
          git commit -m "chore(auto-update): daily fresh domains digest [skip ci]" || echo "No changes to commit"
          git push origin main
